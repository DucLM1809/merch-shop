name: Lint

on:
  pull_request:

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Translation keys and their interpolation arguments are only type-checked if tsc
      # actually runs, and only correct if the generated types still match the en-US
      # resource files (ADR-0017).
      - name: Check generated i18n types are up to date
        run: |
          pnpm i18n:types
          git diff --exit-code -- src/i18n/resources.generated.ts

      - run: pnpm typecheck

      # Types are generated from en-US alone, so they can't tell whether the other
      # locales actually carry every key. A missing one falls back to English at runtime
      # rather than failing, which is exactly the kind of gap that ships unnoticed.
      - name: Check translation key parity across locales
        run: pnpm i18n:parity
